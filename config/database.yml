# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode 
  host: <%= Rails.application.credentials.dig(:supabase, :host) %>
  port: <%= Rails.application.credentials.dig(:supabase, :port) %>
  username: <%= Rails.application.credentials.dig(:supabase, :username) %>
  password: <%= Rails.application.credentials.dig(:supabase, :password) %>
  sslmode: disable

development:
  primary:
    <<: *default
    database: <%= Rails.application.credentials.dig(:supabase, :db_name) %>
  queue:
    <<: *default
    database: <%= Rails.application.credentials.dig(:supabase, :db_name) %>_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: postgres_test

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: <%= Rails.application.credentials.dig(:supabase, :db_name) %>
  cache:
    <<: *default
    database: <%= Rails.application.credentials.dig(:supabase, :db_name) %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= Rails.application.credentials.dig(:supabase, :db_name) %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= Rails.application.credentials.dig(:supabase, :db_name) %>_cable
    migrations_paths: db/cable_migrate
